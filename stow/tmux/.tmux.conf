# Tmux configuration

# Set prefix to Ctrl-a (instead of Ctrl-b)
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Enable mouse support
set -g mouse on

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Increase scrollback buffer
set-option -g history-limit 50000

# Split panes using | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Easy config reload
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Vi mode
setw -g mode-keys vi

# Copy mode bindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Enable 256 colors
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Catppuccin Mocha colors (inline for compatibility)
# Base: #1e1e2e, Surface0: #313244, Surface1: #45475a
# Overlay0: #6c7086, Text: #cdd6f4, Subtext0: #a6adc8
# Blue: #89b4fa, Mauve: #cba6f7, Green: #a6e3a1, Peach: #fab387, Red: #f38ba8

# Status bar
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left "#[fg=#1e1e2e,bg=#cba6f7,bold]  #S #[fg=#cba6f7,bg=#1e1e2e]"
set -g status-right "#[fg=#45475a,bg=#1e1e2e]#[fg=#a6adc8,bg=#45475a] %d/%m #[fg=#313244,bg=#45475a]#[fg=#cdd6f4,bg=#313244,bold] %H:%M "
set -g status-right-length 50
set -g status-left-length 30

setw -g window-status-current-style "fg=#1e1e2e,bg=#89b4fa,bold"
setw -g window-status-current-format " #I:#W#F "

setw -g window-status-style "fg=#6c7086,bg=#1e1e2e"
setw -g window-status-format " #I:#W#F "

# Pane border
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#89b4fa"

# Message style
set -g message-style "fg=#1e1e2e,bg=#fab387,bold"
