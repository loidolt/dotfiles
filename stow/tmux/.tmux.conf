# Tmux configuration

# Set prefix to Ctrl-a (instead of Ctrl-b)
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Enable mouse support
set -g mouse on

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Increase scrollback buffer
set-option -g history-limit 50000

# Split panes using | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Easy config reload
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Vi mode
setw -g mode-keys vi

# Copy mode bindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Enable 256 colors
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Catppuccin Mocha colors
%hidden CMOCHA_BASE="#1e1e2e"
%hidden CMOCHA_SURFACE0="#313244"
%hidden CMOCHA_SURFACE1="#45475a"
%hidden CMOCHA_OVERLAY0="#6c7086"
%hidden CMOCHA_TEXT="#cdd6f4"
%hidden CMOCHA_SUBTEXT0="#a6adc8"
%hidden CMOCHA_BLUE="#89b4fa"
%hidden CMOCHA_MAUVE="#cba6f7"
%hidden CMOCHA_GREEN="#a6e3a1"
%hidden CMOCHA_PEACH="#fab387"
%hidden CMOCHA_RED="#f38ba8"

# Status bar
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#{CMOCHA_BASE} fg=#{CMOCHA_TEXT}"
set -g status-left "#[fg=#{CMOCHA_BASE},bg=#{CMOCHA_MAUVE},bold]  #S #[fg=#{CMOCHA_MAUVE},bg=#{CMOCHA_BASE}]"
set -g status-right "#[fg=#{CMOCHA_SURFACE1}]#[fg=#{CMOCHA_SUBTEXT0},bg=#{CMOCHA_SURFACE1}] %d/%m #[fg=#{CMOCHA_SURFACE0}]#[fg=#{CMOCHA_TEXT},bg=#{CMOCHA_SURFACE0},bold] %H:%M "
set -g status-right-length 50
set -g status-left-length 30

setw -g window-status-current-style "fg=#{CMOCHA_BASE} bg=#{CMOCHA_BLUE} bold"
setw -g window-status-current-format " #I:#W#F "

setw -g window-status-style "fg=#{CMOCHA_OVERLAY0} bg=#{CMOCHA_BASE}"
setw -g window-status-format " #I:#W#F "

# Pane border
set -g pane-border-style "fg=#{CMOCHA_SURFACE1}"
set -g pane-active-border-style "fg=#{CMOCHA_BLUE}"

# Message style
set -g message-style "fg=#{CMOCHA_BASE} bg=#{CMOCHA_PEACH} bold"
