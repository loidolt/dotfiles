# Starship prompt configuration
# Minimal and clean theme

format = """
$directory\
$git_branch\
$git_status\
$python\
$nodejs\
$golang\
$rust\
$docker_context\
$line_break\
$character"""

[directory]
style = "blue"
format = "[$path]($style) "
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = ""
style = "purple"
format = "[$symbol $branch]($style) "

[git_status]
style = "red"
format = "[$all_status$ahead_behind]($style)"

[nodejs]
symbol = "node"
style = "green"
format = "[$symbol $version]($style) "

[rust]
symbol = "rs"
style = "red"
format = "[$symbol $version]($style) "

[golang]
symbol = "go"
style = "cyan"
format = "[$symbol $version]($style) "

[python]
symbol = "py"
style = "yellow"
format = "[$symbol $version]($style) "

[docker_context]
symbol = "docker"
style = "blue"
format = "[$symbol $context]($style) "

[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"
