# Starship prompt configuration
# Informative theme with username, hostname, directory, and git info

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$nix_shell\
$python\
$nodejs\
$golang\
$rust\
$docker_context\
$jobs\
$line_break\
$character"""

# Show command duration and time on the right (less intrusive)
right_format = """$cmd_duration$time"""

[username]
style_user = "cyan bold"
style_root = "red bold"
format = "[$user]($style_user) "
show_always = true

[hostname]
ssh_only = false
style = "green bold"
format = "in [ $hostname]($style) "

[directory]
style = "blue bold"
format = "in [$path]($style) "
truncation_length = 1
truncate_to_repo = true

[git_branch]
symbol = ""
style = "purple bold"
format = "on [ $branch]($style) "

[git_status]
style = "red"
format = "[$all_status$ahead_behind]($style)"
stashed = "≡"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
conflicted = "="
deleted = "✘"
renamed = "»"
modified = "!"
staged = "+"
untracked = "?"

[cmd_duration]
min_time = 2_000
style = "yellow"
format = "[$duration]($style) "

[time]
disabled = false
style = "dimmed white"
format = "[$time]($style)"
time_format = "%H:%M"

[nix_shell]
symbol = ""
style = "blue"
format = "via [$symbol nix]($style) "

[jobs]
style = "bold blue"
symbol = "+"
format = "[$symbol$number]($style) "

[nodejs]
symbol = ""
style = "green"
format = "[$symbol $version]($style) "

[rust]
symbol = ""
style = "red"
format = "[$symbol $version]($style) "

[golang]
symbol = ""
style = "cyan"
format = "[$symbol $version]($style) "

[python]
symbol = ""
style = "yellow"
format = "[$symbol $version]($style) "

[docker_context]
symbol = ""
style = "blue"
format = "[$symbol $context]($style) "

[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"
