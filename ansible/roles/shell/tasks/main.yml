---
- name: Install zsh (if not present)
  package:
    name: zsh
    state: present
  become: "{{ 'yes' if ansible_os_family == 'Debian' else 'no' }}"

- name: Check if oh-my-zsh is installed
  stat:
    path: "{{ ansible_env.HOME }}/.oh-my-zsh"
  register: ohmyzsh_stat

- name: Download oh-my-zsh installation script
  get_url:
    url: https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh
    dest: /tmp/ohmyzsh-install.sh
    mode: '0755'
    force: yes
  when: not ohmyzsh_stat.stat.exists

- name: Install oh-my-zsh
  shell: sh /tmp/ohmyzsh-install.sh --unattended
  when: not ohmyzsh_stat.stat.exists
  register: ohmyzsh_install_result

- name: Clean up oh-my-zsh installation script
  file:
    path: /tmp/ohmyzsh-install.sh
    state: absent
  when: not ohmyzsh_stat.stat.exists

- name: Install zsh-autosuggestions
  git:
    repo: https://github.com/zsh-users/zsh-autosuggestions
    dest: "{{ ansible_env.HOME }}/.oh-my-zsh/custom/plugins/zsh-autosuggestions"
    depth: 1
  when: shell.install_zsh_plugins

- name: Install zsh-syntax-highlighting
  git:
    repo: https://github.com/zsh-users/zsh-syntax-highlighting
    dest: "{{ ansible_env.HOME }}/.oh-my-zsh/custom/plugins/zsh-syntax-highlighting"
    depth: 1
  when: shell.install_zsh_plugins

- name: Check if Starship is installed
  command: which starship
  register: starship_installed
  ignore_errors: yes
  changed_when: false

- name: Install Starship prompt (macOS)
  homebrew:
    name: starship
    state: present
  when: ansible_os_family == "Darwin" and shell.install_starship and starship_installed.rc != 0

- name: Download Starship installation script (Linux)
  get_url:
    url: https://starship.rs/install.sh
    dest: /tmp/starship-install.sh
    mode: '0755'
    force: yes
  when: ansible_os_family == "Debian" and shell.install_starship and starship_installed.rc != 0

- name: Install Starship prompt (Linux)
  shell: sh /tmp/starship-install.sh -y
  when: ansible_os_family == "Debian" and shell.install_starship and starship_installed.rc != 0
  register: starship_install_result

- name: Clean up Starship installation script
  file:
    path: /tmp/starship-install.sh
    state: absent
  when: ansible_os_family == "Debian" and shell.install_starship and starship_installed.rc != 0
