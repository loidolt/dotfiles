---
- name: Install Docker Desktop (macOS)
  homebrew_cask:
    name: docker
    state: present
  when: ansible_os_family == "Darwin" and docker.install_docker_desktop

- name: Install Docker (Linux)
  block:
    - name: Add Docker GPG key
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/trusted.gpg.d/docker.asc
        mode: '0644'
      become: yes
    
    - name: Determine architecture
      set_fact:
        docker_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"
    
    - name: Add Docker repository
      apt_repository:
        repo: "deb [arch={{ docker_arch }}] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
      become: yes
    
    - name: Install Docker packages
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: yes
      become: yes
    
    - name: Add user to docker group
      user:
        name: "{{ ansible_user_id }}"
        groups: docker
        append: yes
      become: yes
  
  when: ansible_os_family == "Debian"

- name: Pull useful Docker images
  docker_image:
    name: "{{ item }}"
    source: pull
  loop:
    - mcp/sequentialthinking
    - mcp/memory
  ignore_errors: yes
  when: docker.install
