---
- name: Install GUI applications (macOS)
  homebrew_cask:
    name: "{{ item }}"
    state: present
  loop: "{{ applications.apps }}"
  when: ansible_os_family == "Darwin"
  ignore_errors: yes

- name: Install Nerd Fonts (macOS)
  homebrew:
    name: "{{ item }}"
    state: present
  loop: "{{ fonts.fonts_to_install }}"
  when: ansible_os_family == "Darwin" and fonts.install_nerd_fonts
  ignore_errors: yes

- name: Display manual installation instructions for Linux
  debug:
    msg:
      - "GUI applications need to be installed manually on Linux:"
      - "- VS Code: https://code.visualstudio.com/download"
      - "- Chrome: https://www.google.com/chrome/"
      - "- Slack: https://slack.com/downloads/linux"
  when: ansible_os_family == "Debian"
