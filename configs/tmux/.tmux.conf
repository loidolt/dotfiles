# Tmux Configuration for OpenCode and Truecolor Support

# Enable 24-bit truecolor support
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*256col*:Tc"
set -as terminal-overrides ",*256col*:RGB"

# Alternative: Use screen-256color if tmux-256color causes issues
# set -g default-terminal "screen-256color"
# set -as terminal-overrides ",*:Tc"
# set -as terminal-overrides ",*:RGB"

# Enable focus events (useful for editors)
set -g focus-events on

# Set escape time to 0 for better vim/neovim experience
set -sg escape-time 0

# Increase scrollback buffer size
set -g history-limit 50000

# Enable mouse support (optional)
set -g mouse on

# Use vi mode in copy mode (optional)
setw -g mode-keys vi

# Start window and pane indices at 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Enable activity monitoring
setw -g monitor-activity on
set -g visual-activity off

# Set terminal title
set -g set-titles on
set -g set-titles-string "#T"

# Status bar configuration
set -g status-interval 5
set -g status-position bottom
set -g status-justify left

# Allow automatic renaming of windows
setw -g automatic-rename on
